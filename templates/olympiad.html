{% extends "base.html" %}

{% block content %}
<style>
.olympiad-page {
    max-width: 760px;
    margin: 18px auto;
    padding: 20px 14px;
    border-radius: 20px;
    background: linear-gradient(135deg, #e0f2fe, #fce7f3, #ede9fe);
}

.olympiad-heading {
    text-align: center;
    font-size: clamp(30px, 5vw, 40px);
    font-weight: 900;
    background: linear-gradient(90deg, #7c3aed, #db2777, #ea580c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 5px;
}

.olympiad-subtitle {
    text-align: center;
    font-size: 15px;
    margin-bottom: 18px;
    color: #374151;
}

.class-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
}

.class-card {
    display: flex;
    min-height: 76px;
    padding: 10px 6px;
    border-radius: 13px;
    text-align: center;
    text-decoration: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
    box-shadow: 0 3px 8px #0002;
    transition: transform .2s;
}

.class-card:hover {
    color: white;
    transform: translateY(-2px);
}

.class-name {
    font-size: 23px;
    line-height: 1.2;
    font-weight: 900;
    text-shadow: 1px 1px 2px #0005;
}

.class-caption {
    font-size: 12px;
    font-weight: 700;
    margin-top: 4px;
}

.class-10 { background: linear-gradient(135deg,#2563eb,#06b6d4); }
.class-9  { background: linear-gradient(135deg,#7c3aed,#c026d3); }
.class-8  { background: linear-gradient(135deg,#059669,#65a30d); }
.class-7  { background: linear-gradient(135deg,#ea580c,#f59e0b); }
.class-6  { background: linear-gradient(135deg,#db2777,#f472b6); }
.class-5  { background: linear-gradient(135deg,#4338ca,#818cf8); }
.class-4  { background: linear-gradient(135deg,#0f766e,#2dd4bf); }
.class-3  { background: linear-gradient(135deg,#b91c1c,#fb7185); }
.class-2  { background: linear-gradient(135deg,#6d28d9,#a78bfa); }
.class-1  { background: linear-gradient(135deg,#0369a1,#38bdf8); }
</style>

<div class="container olympiad-page">
    <h1 class="olympiad-heading">🏆 Olympiad</h1>
    <p class="olympiad-subtitle">
        Select your class to explore the examinations
    </p>

    <div class="class-grid">
        {% for class_no in olympiad_classes %}
        <a href="{% url 'olympiad_class' class_no %}"
           class="class-card class-{{ class_no }}">
            <span class="class-name">CLASS {{ class_no }}</span>
            <span class="class-caption">Select Class →</span>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
