{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

/* =========================================================
   EDUMIND TOP HEADER
   ========================================================= */

.edumind-top-header {
    width: 100%;

    display: flex;
    align-items: center;

    min-height: 150px;

    padding: 10px 18px;

    box-sizing: border-box;

    background:
        linear-gradient(
            110deg,
            #ecfdf5,
            #eff6ff,
            #f5f3ff,
            #ecfdf5
        );

    border-radius: 20px;

    box-shadow:
        0 6px 22px rgba(15, 118, 110, 0.10);

    overflow: hidden;
}


/* =========================================================
   LOGO AREA
   ========================================================= */

.edumind-logo-area {

    flex: 0 0 auto;

    width: 200px;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 10;
}


.edumind-logo-area img {

    width: 275px;

    height: 275px;

    object-fit: contain;

    border-radius: 18px;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.12);
}


/* =========================================================
   MOVING IMAGE AREA
   ========================================================= */

.edumind-carousel {

    flex: 1;

    min-width: 0;

    height: 300px;

    overflow: hidden;

    position: relative;

    display: flex;

    align-items: center;

    margin: 0 10px;
}


/* =========================================================
   MOVING TRACK
   ========================================================= */

.edumind-carousel-track {

    display: flex;

    align-items: center;

    gap: 18px;

    width: max-content;

    animation:
        edumind-carousel-move 12s linear infinite;

    will-change: transform;
}


/* =========================================================
   IMAGES
   ========================================================= */

.edumind-carousel-image {

    flex: 0 0 200px;

    width: 250px;

    height: 235px;

    object-fit: contain;

    background: white;

    padding: 5px;

    box-sizing: border-box;

    border-radius: 14px;

    border: 1px solid rgba(16, 185, 129, 0.18);

    box-shadow:
        0 5px 14px rgba(0, 0, 0, 0.10);
}


/* =========================================================
   CONTINUOUS CYCLIC MOVEMENT
   ========================================================= */

@keyframes edumind-carousel-move {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }

}


/* =========================================================
   RIGHT SIDE EDUMIND TITLE
   ========================================================= */

.edumind-title-area {

    flex: 0 0 auto;

    width: 235px;

    text-align: center;

    z-index: 10;

    padding: 0 10px;
}


.edumind-title-area h1 {

    margin: 0;

    font-size: 38px;

    font-weight: 900;

    letter-spacing: 1px;

    background:
        linear-gradient(
            90deg,
            #047857,
            #059669,
            #2563eb,
            #7c3aed
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


.edumind-title-area p {

    margin: 5px 0 0;

    font-size: 13px;

    font-weight: 600;

    color: #475569;
}


/* =========================================================
   EXAMS PAGE - HIDE CAROUSEL
   ========================================================= */

.page-exams .edumind-carousel {

    display: none;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 900px) {

    .edumind-top-header {

        min-height: 110px;

        padding: 7px 8px;

    }


    .edumind-logo-area {

        width: 90px;

    }


    .edumind-logo-area img {

        width: 82px;

        height: 82px;

    }


    .edumind-carousel {

        height: 90px;

    }


    .edumind-carousel-image {

        flex-basis: 90px;

        width: 90px;

        height: 82px;

    }


    .edumind-title-area {

        width: 115px;

        padding: 0 5px;

    }


    .edumind-title-area h1 {

        font-size: 22px;

    }


    .edumind-title-area p {

        font-size: 9px;

    }

}
/* =========================================
   EDUMIND PAGE-SPECIFIC GRADIENT BACKGROUNDS
   ========================================= */

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background-size: 300% 300%;
    background-attachment: fixed;

    animation: eduMindBackground 60s ease infinite;
}

@keyframes eduMindBackground {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

/* =================================

   ================================= */

.edumind-top-bar {

}


/* =================================
   LOGO — LEFT
   ================================= */

.logo-container {
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

.logo-container img {
    width: 300px;
    height: 300px;
    object-fit: contain;
    border-radius: 10px;
}


/* =================================
   EDUMIND TITLE — RIGHT
   ================================= */

.edumind-header {
    margin-left: auto;
    width: 300px;
    text-align: center;
    padding-left: 18px;
}

.edumind-title {
    margin: 0;
    font-size: 42px;
    font-weight: 800;
    line-height: 1.05;

    background: linear-gradient(
        90deg,
        #00a878,
        #00b4d8,
        #7b2cbf
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.tagline {
    margin-top: 8px;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.1;

    background: linear-gradient(
        90deg,
        #7b2cbf,
        #00b4d8,
        #00a878
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;

    white-space: nowrap;
}


.tagline {
    margin-top: 2px;

    font-size: 13px;

    color: white;
}

@media (max-width: 600px) {

    justify-content: space-between;
    width: 100%;
    padding: 10px 18px;

    box-sizing: border-box;
}

}

/* =================================

.main-navigation {

.nav-brand {

}

.main-navigation .nav-links {
    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: 8px;

    flex-wrap: wrap;
}

.main-navigation .nav-links a {
    color: #ffffff;

    font-weight: 700;

}

.main-navigation .nav-links a:hover {
    background: rgba(255, 255, 255, 0.22);

    color: #ffffff;

    transform: translateY(-2px);
}

/* =====================================================

    flex-wrap: wrap;

            #ecfdf5
        );

}


.main-navigation a {

    display: inline-flex;

    border: 1px solid rgba(148, 163, 184, 0.18);

    text-decoration: none;

    font-size: 14px;

    font-weight: 700;

    transition:
        all 0.2s ease;
}


.main-navigation a:hover {

    color: white;

    background:
        linear-gradient(
            135deg,
            #047857,
            #059669
        );

    transform: translateY(-1px);

    box-shadow:
        0 4px 12px rgba(4, 120, 87, 0.18);
}


/* =====================================================
   MOBILE NAVIGATION
   ===================================================== */

@media (max-width: 600px) {

    .main-navigation {

        gap: 5px;

        padding: 7px;

    }


    .main-navigation a {

        padding: 7px 10px;

        font-size: 12px;

    }

    }

    /* Carousel container */
.edumind-carousel {
    overflow: hidden;
    position: relative;
}

/* Continuously moving image track */
.edumind-carousel-track {
    display: flex;
    width: max-content;
    animation: edumindImageFlow 30s linear infinite;
    will-change: transform;
}

/* Pause the image flow while the cursor is over it */
.edumind-carousel:hover .edumind-carousel-track {
    animation-play-state: paused;
}

/* Image styling */
.edumind-carousel-image {
    display: block;
    flex-shrink: 0;
    cursor: pointer;
}

/* Continuous horizontal movement */
@keyframes edumindImageFlow {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-50%);
    }
}
.edumind-carousel:hover .edumind-carousel-track {
    animation-play-state: paused;
}

</style>

</head>
